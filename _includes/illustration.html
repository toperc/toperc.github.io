{% assign artwork = site.data.illustrations[include.key] %}
{% if artwork %}
<div class="section-art" aria-hidden="true">
  <img src="{{ artwork.src | relative_url }}" alt="" width="{{ artwork.width }}" height="{{ artwork.height }}" decoding="async" data-parallax-art>
  <span>Ilustración conceptual · TopeRC</span>
</div>
{% endif %}
