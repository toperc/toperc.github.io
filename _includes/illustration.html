{% assign artwork = site.data.illustrations[include.key] %}
{% if artwork %}
<figure class="artwork">
  <img src="{{ artwork.src | relative_url }}" alt="{{ artwork.alt | escape }}" width="{{ artwork.width }}" height="{{ artwork.height }}" loading="lazy" decoding="async">
  <figcaption>Ilustración conceptual · TopeRC</figcaption>
</figure>
{% endif %}
