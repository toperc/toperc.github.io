{% if page.video_id %}
<section class="article-video" aria-labelledby="article-video-title">
  <h2 id="article-video-title">{% if page.content_type == 'review' %}La review en vídeo{% else %}El vídeo de esta guía{% endif %}</h2>
  <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/{{ page.video_id | escape }}" title="{{ page.title | escape }} — vídeo de TopeRC" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
  <p><a href="https://www.youtube.com/watch?v={{ page.video_id | escape }}" target="_blank" rel="noopener noreferrer">Abrir el vídeo en YouTube ↗</a></p>
</section>
{% endif %}
