{%- assign logo_variant = include.variant | default: 'compact' -%}
{%- assign partner_logo = site.data.partners.hobbyking.logos[logo_variant] -%}
<img class="partner-logo partner-logo-{{ logo_variant }}" src="{{ partner_logo.src | relative_url }}" alt="{% unless include.decorative %}HobbyKing{% endunless %}" width="{{ partner_logo.width }}" height="{{ partner_logo.height }}" loading="lazy" decoding="async">
