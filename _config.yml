# Social usernames
tiktok_username: "toperc.es"
instagram_username: "toperc.es"
youtube_username: "@TopeRC-es"

# Base Config
baseurl: "" # La URL base de tu sitio web
url: "https://toperc.com" # La URL completa de tu sitio web
title: "TopeRC"
author: "TopeRC Team"
email: "toperc.es@gmail.com"
description: >-
  El sitio número uno para amantes de coches radiocontrol.
  Reviews, guías, modificaciones y recambios para coches 
  RC de diferentes escalas y marcas.
markdown: kramdown
permalink: /:categories/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-toc

# Third-party applications
disqus: toperc

# Collections
collections:
  models:
    permalink: /coches/:name/
    output: true
  tag:
    permalink: /tag/:title
    output: true

show_excerpts: true

defaults:
  - scope:
      path: ""
      type: "models"
    values:
      layout: model
      section: models
      eyebrow: "El garaje / Modelo"
      wide: true
      toc: false
  - scope:
      path: ""
      type: "tag"
    values:
      layout: tag_page
  - scope:
      path: ""
    values:
      toc: true
      excerpt_separator: <!--more-->
